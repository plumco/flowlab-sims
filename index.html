<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huliot Simulators</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#12171e;--mut:#5a6572;--bd:#d6dce3;--ac:#0b6b3a;--acbg:#e3f3ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--card:#171d24;--tx:#e8edf2;--mut:#98a4b1;--bd:#2a3440;--ac:#4cc582;--acbg:#16301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1418;--card:#171d24;--tx:#e8edf2;--mut:#98a4b1;--bd:#2a3440;--ac:#4cc582;--acbg:#16301f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto}
header{margin-bottom:22px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--mut);margin:0;max-width:60ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar input{flex:1;min-width:180px;font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.tags button.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.sim{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;text-decoration:none;color:inherit}
.sim:hover,.sim:focus-visible{border-color:var(--ac);outline:none}
.sim h2{font-size:17px;margin:0;line-height:1.3}
.sim p{margin:0;color:var(--mut);font-size:14px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acbg);color:var(--ac)}
.open{font-size:13px;font-weight:600;color:var(--ac)}
.none{color:var(--mut);padding:20px 0}
footer{margin-top:28px;color:var(--mut);font-size:13px}
</style></head><body>
<div class="wrap">
<header>
 <h1>Huliot Simulators</h1>
 <p class="lead">Interactive drainage and plumbing simulators. Open one in your browser, change the inputs and watch the result live. Nothing to install.</p>
</header>
<div class="bar">
 <input id="q" type="search" placeholder="Search simulators" aria-label="Search simulators">
 <div class="tags" id="tags"></div>
</div>
<div class="list" id="list"></div>
<div class="none" id="none" hidden>No simulator matches this search.</div>
<footer>Screening models for comparing options. Not for final design. Confirm with on-site readings.</footer>
</div>
<script src="sims.js"></script>
<script>
(function(){
 var all=(window.SIMS||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
 var tag='',q='';
 var $=function(id){return document.getElementById(id)};
 var tags=[];all.forEach(function(s){(s.tags||[]).forEach(function(t){if(tags.indexOf(t)<0)tags.push(t)})});
 function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function drawTags(){
  $('tags').innerHTML=tags.length>1?['All'].concat(tags).map(function(t){var on=(t==='All'&&!tag)||t===tag;return '<button type="button" class="'+(on?'on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join(''):'';
 }
 function draw(){
  var l=all.filter(function(s){
   var hay=(s.title+' '+s.description+' '+(s.tags||[]).join(' ')).toLowerCase();
   return (!tag||(s.tags||[]).indexOf(tag)>=0)&&(!q||hay.indexOf(q)>=0)});
  $('list').innerHTML=l.map(function(s){
   return '<a class="sim" href="'+esc(s.path)+'"><h2>'+esc(s.title)+'</h2><p>'+esc(s.description)+'</p><div class="meta">'+(s.tags||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div><span class="open">Open simulator →</span></a>'}).join('');
  $('none').hidden=l.length>0;
 }
 $('tags').onclick=function(e){var t=e.target.getAttribute&&e.target.getAttribute('data-t');if(t==null)return;tag=t==='All'?'':t;drawTags();draw()};
 $('q').oninput=function(e){q=e.target.value.trim().toLowerCase();draw()};
 drawTags();draw();
})();
</script>
</body></html>
