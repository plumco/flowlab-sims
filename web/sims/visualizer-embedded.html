<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunken + Swept Tee CAD Visualizer</title>
<style>
:root {
  --bg: #000000;
  --card: #131b26;
  --tx: #e8ecf1;
  --mut: #9aa6b4;
  --bd: #263347;
  --ac: #0066ff;
  --ok: #10b981;
  --wa: #f59e0b;
  --er: #ef4444;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: var(--tx);
  font: 12.5px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 6px 12px;
  background: #090d14;
  border-bottom: 1px solid #1e293b;
  user-select: none;
}
.btn-group {
  display: inline-flex;
  align-items: center;
  background: #111827;
  padding: 2px;
  border-radius: 8px;
  border: 1px solid #1f2937;
  gap: 2px;
}
.btn-group-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #64748b;
  padding: 0 6px 0 4px;
}
button {
  font: inherit;
  font-size: 11.5px;
  font-weight: 500;
  padding: 5px 9px;
  border-radius: 6px;
  border: 1px solid #374151;
  background: #1f2937;
  color: #e5e7eb;
  cursor: pointer;
  transition: all 0.12s ease;
}
button:hover { background: #374151; }
button.pri { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: 600; }
button.pri:hover { background: #0369a1; }
button.btn-overload {
  background: #c2410c;
  color: #fff;
  border-color: #ea580c;
  font-weight: 700;
}
button.btn-overload:hover { background: #9a3412; }
button.btn-rush {
  background: #b45309;
  color: #fff;
  border-color: #f59e0b;
  font-weight: 700;
}
button.btn-rush:hover { background: #92400e; }
button.on { border-color: #0284c7; background: rgba(2,132,199,0.25); color: #38bdf8; }
.badge {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 5px;
  background: #111827;
  border: 1px solid #374151;
  color: #9ca3af;
}
.badge b { color: #38bdf8; }
#sw {
  background: #000;
  border: none;
  overflow: auto;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
  color-scheme: dark;
  width: 100%;
  height: calc(100vh - 42px);
}
#spacer { position: relative; }
#sheet { position: sticky; top: 0; left: 0; display: block; cursor: pointer; }

/* Annular Flow Cut-Section HUD */
.annular-hud {
  position: fixed;
  top: 48px;
  right: 14px;
  width: 255px;
  background: rgba(11, 15, 23, 0.94);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid #1e293b;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.65);
  z-index: 1000;
  user-select: none;
  font-family: system-ui, -apple-system, sans-serif;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.annular-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 10px;
  background: rgba(19, 27, 38, 0.85);
  border-bottom: 1px solid #1f2937;
  border-radius: 8px 8px 0 0;
}

/* Pulsing Active Feedback for Buttons */
@keyframes flushPulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 102, 255, 0.8), 0 0 10px rgba(56, 189, 248, 0.9); }
  50% { box-shadow: 0 0 0 6px rgba(0, 102, 255, 0.35), 0 0 20px rgba(56, 189, 248, 1); }
  100% { box-shadow: 0 0 0 0 rgba(0, 102, 255, 0), 0 0 10px rgba(56, 189, 248, 0.9); }
}

@keyframes flushAllPulse {
  0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.9), 0 0 12px rgba(249, 115, 22, 0.9); }
  50% { box-shadow: 0 0 0 7px rgba(234, 88, 12, 0.35), 0 0 22px rgba(249, 115, 22, 1); }
  100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0), 0 0 12px rgba(249, 115, 22, 0.9); }
}

button.flushing-active {
  background: #0284c7 !important;
  border-color: #38bdf8 !important;
  color: #ffffff !important;
  font-weight: 700 !important;
  animation: flushPulse 1.2s infinite ease-in-out;
  transform: scale(1.04);
}

button.flush-all-active {
  background: #c2410c !important;
  border-color: #ea580c !important;
  color: #ffffff !important;
  font-weight: 700 !important;
  animation: flushAllPulse 1.2s infinite ease-in-out;
  transform: scale(1.04);
}

/* Floating HUD Toast Notification */
#flushToast {
  position: fixed;
  top: 50px;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: rgba(11, 15, 23, 0.96);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1.5px solid #38bdf8;
  color: #fff;
  padding: 7px 20px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 16px rgba(56,189,248,0.5);
  z-index: 2000;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
#flushToast.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="toolbar">
  <!-- Group 1: Testing Suite -->
  <div class="btn-group">
    <button class="pri" id="bFlush" title="Standard EN 12056 Test (Selected Floors)">💧 Flush Now</button>
    <button class="btn-overload" id="bFlushAll" title="Extreme Full Building Shock Discharge (100% Load)">⚡ Flush All (Shock)</button>
    <button class="btn-rush" id="bMorningRush" title="1-Hour Peak Domestic Morning Rush Simulation">🎲 Morning Rush</button>
  </div>

  <!-- Group 2: Simulation Engine Controls -->
  <div class="btn-group">
    <button id="bPlay" title="Play / Pause Simulation Flow">▶ Play</button>
    <button id="bReset" title="Refill all water traps to full depth">↺ Refill</button>
  </div>

  <!-- Live Countdown Timer Indicator -->
  <div id="testTimerBadge" style="display:none;background:rgba(2,132,199,0.2);border:1.5px solid #38bdf8;color:#38bdf8;padding:4px 9px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:0.3px;align-items:center;gap:6px">
    <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#38bdf8;animation:flushPulse 1s infinite"></span>
    <span id="timerText">Testing 10s...</span>
  </div>

  <!-- Group 3: Camera & Viewport -->
  <div class="btn-group">
    <button id="vFull" class="on" title="Full CAD Overview">Full CAD</button>
    <button id="vFit" title="Fit Entire Building Height">Fit</button>
    <button id="vPrl" title="Zoom into Positive Relief Line">PRL</button>
    <button id="bTop" title="Scroll to Roof Vent">↑ Top</button>
    <button id="bMid" title="Scroll to Middle Storeys">⬍ Mid</button>
    <button id="bBot" title="Scroll to Stack Base">↓ Bot</button>
  </div>

  <!-- Group 4: Engineering Diagnostics & Inspection -->
  <div class="btn-group">
    <button id="bZoomIn" title="Zoom In (+)">🔍+</button>
    <button id="bZoomOut" title="Zoom Out (−)">🔍−</button>
    <button id="bLoupe" title="दूरबीन (Inspection Loupe) - Magnify pipe joints & traps">🔭 दूरबीन</button>
    <button id="bCutSection" class="on" title="Toggle Live Annular Flow Cut-Section HUD">🔬 Cut-Section</button>
  </div>

  <div style="flex:1"></div>
  <div class="badge" id="b_stats">
    Building: <b id="st_floors">10F</b> &nbsp;|&nbsp; Active: <b id="st_act">4F</b> &nbsp;|&nbsp; Flow: <b id="st_flow">4.0 L/s</b>
  </div>
</div>

<!-- Floating Action Feedback Banner -->
<div id="flushToast">
  <span id="toastIcon" style="font-size:14px">💧</span>
  <span id="toastMsg">Discharging Active Bathrooms...</span>
</div>

<div id="sw"><div id="spacer"><canvas id="sheet"></canvas></div></div>

<!-- Live Annular Water Film & Air Core 2D Cut-Section HUD -->
<div id="annularHud" class="annular-hud">
  <div class="annular-hdr">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:13px">🔬</span>
      <div>
        <div style="font-weight:700;color:#38bdf8;font-size:11px;letter-spacing:0.3px">ANNULAR FLOW CUT-SECTION</div>
        <div style="font-size:9px;color:#94a3b8">Wyly-Eaton Dynamics &bull; &empty;<span id="hud_d">110</span>mm Stack</div>
      </div>
    </div>
    <button id="btnToggleHud" style="padding:1px 5px;font-size:10px;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:4px;cursor:pointer" title="Minimize / Expand">—</button>
  </div>
  <div id="hud_body" style="display:flex;gap:10px;align-items:center;padding:8px 10px">
    <div style="position:relative;width:110px;height:110px;flex-shrink:0">
      <canvas id="annularCanvas" width="110" height="110"></canvas>
    </div>
    <div style="flex:1;font-size:10.5px;line-height:1.45;color:#cbd5e1">
      <div style="display:flex;justify-content:space-between"><span>Film (<b style="color:#60a5fa">t<sub>w</sub></b>):</span><b id="hud_tw" style="color:#60a5fa">2.4 mm</b></div>
      <div style="display:flex;justify-content:space-between"><span>Air Core:</span><b id="hud_dair" style="color:#38bdf8">105 mm</b></div>
      <div style="display:flex;justify-content:space-between"><span>Air Free:</span><b id="hud_airpct" style="color:#10b981">91%</b></div>
      <div style="display:flex;justify-content:space-between"><span>Velocity:</span><b id="hud_vt" style="color:#e2e8f0">3.7 m/s</b></div>
      <div style="display:flex;justify-content:space-between"><span>Fall Lt:</span><b id="hud_lt" style="color:#e2e8f0">2.3 m</b></div>
      <div id="hud_status" style="margin-top:5px;padding:3px 4px;border-radius:4px;text-align:center;font-weight:700;font-size:9px;background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.4)">
        ✓ STABLE ANNULAR
      </div>
    </div>
  </div>
</div>

<script>
/* =================== parameters =================== */
const P={N:10,H:3,D:110,nAct:4,qf:1.0,seal:50,vent:'open',prl:1,prlD:110,tee:'swept',surge:2.5,sewer:0,pattern:'mix'};
const TS=0.3,RISE=0.8,HOLD=3,TAU=1.2,OPTS=[1,2,3];
const SYSNAME={1:'A',2:'B',3:'C'};
const $=id=>document.getElementById(id);
let RR={},AA={},OS={},SEL=1,C={},last=0,fcount=0,CFG={},CK='',VIEW='full',PEND=null,SAVED=null;
const NMIN=2,NMAX=100,PITCH=72;
let VP={s:1,sx:0,sy:0,W:0,H:0},VIS={y0:0,y1:1e9,lod:0},MINW=.4;
const SB={1:{sx:22,x0:40,x1:142,t0:71,adj:0,dt:-13,wbx:80},2:{sx:167,x0:171,x1:289,t0:71,adj:-4,dt:-19,wbx:226.5},3:{sx:335,x0:354,x1:456,t0:61,adj:0,dt:-15,wbx:393}};
const Lof=k=>SB[k].t0+(P.N-1)*PITCH+SB[k].adj;
const HSheet=()=>71+(P.N-1)*PITCH+133;
function zoomBox(k){const L=Lof(k);return{1:[0,L-75,150,125],2:[160,L-65,136,152],3:[326,L-65,150,152]}[k]}
function ensureCfg(){const key=P.N+'|'+P.prl;if(key!==CK){CK=key;OPTS.forEach(o=>CFG[o]=sysCfg(o))}}
const TL={t:0,t0:0,run:false,speed:1,mode:'cycle',act:[],fa:32,flushes:0,wat:[],air:[]};
function seedFx(){const n=P.N;TL.wat=Array.from({length:Math.min(2000,Math.max(110,n*22))},()=>Math.random());const na=Math.min(150,Math.max(14,n*3));TL.air=Array.from({length:na},(_,i)=>i/na)}

/* =================== UI & controls =================== */
let flushTimer = null;
let toastTimer = null;

function showToast(icon, msg, durationMs = 3500) {
  const toast = $('flushToast');
  if (!toast) return;
  $('toastIcon').textContent = icon;
  $('toastMsg').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, durationMs);
}

let testCountdownTimer = null;
let testSecondsLeft = 0;

function startTestTimer(seconds, title, onComplete) {
  clearInterval(testCountdownTimer);
  testSecondsLeft = seconds;
  const badge = $('testTimerBadge');
  const txt = $('timerText');
  if (badge && txt) {
    badge.style.display = 'inline-flex';
    txt.textContent = `${title} (${testSecondsLeft}s)`;
  }
  testCountdownTimer = setInterval(() => {
    testSecondsLeft--;
    if (testSecondsLeft <= 0) {
      clearInterval(testCountdownTimer);
      if (badge) badge.style.display = 'none';
      if (onComplete) onComplete();
    } else if (txt) {
      txt.textContent = `${title} (${testSecondsLeft}s)`;
    }
  }, 1000);
}

function stopTestTimer() {
  clearInterval(testCountdownTimer);
  const badge = $('testTimerBadge');
  if (badge) badge.style.display = 'none';
}

function setFlushNowActiveState(customFloors) {
  const btn = $('bFlush');
  const btnAll = $('bFlushAll');
  if (!btn) return;

  // Clear flush-all active state if it was active
  if (btnAll) {
    btnAll.classList.remove('flush-all-active');
    btnAll.textContent = '⚡ Flush All (Shock)';
  }

  btn.classList.add('flushing-active');
  const activeList = customFloors || TL.act || [];
  const count = activeList.length > 0 ? activeList.length : P.nAct;
  const floorsStr = activeList.length > 0 ? activeList.map(f => 'F' + f).join(', ') : `${count} Floors`;
  btn.textContent = `⚡ Flushing (${count}F)...`;

  showToast('💧', `Discharging Active Bathrooms: [${floorsStr}] • Rate: ${(count * P.qf).toFixed(1)} L/s`, 4000);

  startTestTimer(10, `EN 12056 Test`, () => {
    btn.textContent = '✓ Test Complete!';
    setTimeout(() => {
      btn.classList.remove('flushing-active');
      btn.textContent = '💧 Flush Now';
    }, 1200);
  });
}

function setFlushAllActiveState() {
  const btn = $('bFlush');
  const btnAll = $('bFlushAll');
  if (!btnAll) return;

  if (btn) {
    btn.classList.remove('flushing-active');
    btn.textContent = '💧 Flush Now';
  }

  btnAll.classList.add('flush-all-active');
  btnAll.textContent = `⚡ Shock Flush Running...`;
  showToast('⚡', `All ${P.N} Bathrooms Discharging Simultaneously! (100% Full Load • ${(P.N * P.qf).toFixed(1)} L/s)`, 4500);

  startTestTimer(10, `Simultaneous Shock Test`, () => {
    btnAll.textContent = '⚠️ Shock Test Complete!';
    TL.run = false; // Auto-pause after 10s
    setPlayLabel();
    showToast('⚠️', `Full Building Shock Test Complete (10s)! Check Results & Report.`, 4500);
    setTimeout(() => {
      btnAll.classList.remove('flush-all-active');
      btnAll.textContent = '⚡ Flush All (Shock)';
    }, 2000);
  });
}

function resetFlushButtons() {
  stopTestTimer();
  const btn = $('bFlush');
  const btnAll = $('bFlushAll');
  if (btn) {
    btn.classList.remove('flushing-active');
    btn.textContent = '💧 Flush Now';
  }
  if (btnAll) {
    btnAll.classList.remove('flush-all-active');
    btnAll.textContent = '⚡ Flush All (Shock)';
  }
}

function setPlayLabel(){$('bPlay').textContent=TL.run?'⏸ Pause':'▶ Play'}
$('bPlay').onclick=()=>{
  TL.run=!TL.run;
  setPlayLabel();
  showToast(TL.run ? '▶' : '⏸', TL.run ? 'Simulation Resumed' : 'Simulation Paused', 1800);
};
$('bFlush').onclick=()=>{
  TL.run=true;
  TL.mode='cycle';
  setPlayLabel();
  pickActive();
  setFlushNowActiveState();
};
$('bFlushAll').onclick=()=>{
  TL.run=true;
  TL.mode='hold'; // Hold active water flow continuously on all bathrooms
  setPlayLabel();
  P.nAct=P.N;
  P.pattern='all';
  pickActive(true);
  updateToolbarStats();
  setFlushAllActiveState();
  if(window.parent && window.parent !== window){
    window.parent.postMessage({action:'onFlushAll',floors:P.N},'*');
  }
};
let isRushActive = false;
$('bMorningRush').onclick=()=>{
  isRushActive = !isRushActive;
  $('bMorningRush').style.background = isRushActive ? '#059669' : '#b45309';
  $('bMorningRush').style.borderColor = isRushActive ? '#10b981' : '#f59e0b';
  $('bMorningRush').textContent = isRushActive ? '✓ Rush Active' : '🎲 Morning Rush';
  showToast(isRushActive ? '🎲' : '⏹', isRushActive ? '1-Hour Morning Rush Sim Active (Peak Concurrency)' : 'Morning Rush Mode Deactivated', 2500);
  if(window.parent && window.parent !== window){
    window.parent.postMessage({action:'toggleMorningRush', enabled: isRushActive},'*');
  }
};
$('bReset').onclick=()=>{
  OPTS.forEach(k=>{OS[k].seal.fill(P.seal);OS[k].y.fill(0);OS[k].v.fill(0)});
  resetFlushButtons();
  showToast('↺', 'Traps Refilled to Full Initial Depth (50 mm)', 2200);
};

let zoomScale = 1.0;
let LOUPE = false;
let mouseX = -1000, mouseY = -1000, mouseInside = false;
let isDragging = false, dragStartX = 0, dragStartY = 0, scrollStartL = 0, scrollStartT = 0;

function setView(v){
  const sw=$('sw');
  if(VIEW==='full')SAVED=[sw.scrollLeft,sw.scrollTop];
  VIEW=v;
  zoomScale = 1.0;
  if(v==='full'&&SAVED)PEND={x:SAVED[0],y:SAVED[1]};
  ['full','fit','prl'].forEach(m=>$('v'+m[0].toUpperCase()+m.slice(1)).classList.toggle('on',v===m));
}
$('vFull').onclick=()=>setView('full');
$('vFit').onclick=()=>setView('fit');
$('vPrl').onclick=()=>setView('prl');

$('bTop').onclick=()=>{if(VIEW!=='full')setView('full');PEND={top:1}};
$('bMid').onclick=()=>{if(VIEW!=='full')setView('full');PEND={mid:1}};
$('bBot').onclick=()=>{if(VIEW!=='full')setView('full');PEND={bot:1}};

$('bZoomIn').onclick=()=>{
  if(VIEW!=='full')setView('full');
  zoomScale = Math.min(3.2, zoomScale * 1.25);
};
$('bZoomOut').onclick=()=>{
  if(VIEW!=='full')setView('full');
  zoomScale = Math.max(0.35, zoomScale / 1.25);
};
$('bLoupe').onclick=()=>{
  LOUPE = !LOUPE;
  $('bLoupe').classList.toggle('on', LOUPE);
};

const swEl = $('sw'), sheetEl = $('sheet');
sheetEl.addEventListener('mousedown', e => {
  if (e.button === 0 && !LOUPE) {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    scrollStartL = swEl.scrollLeft;
    scrollStartT = swEl.scrollTop;
  }
});
window.addEventListener('mousemove', e => {
  const r = sheetEl.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
  mouseInside = (mouseX >= 0 && mouseX <= r.width && mouseY >= 0 && mouseY <= r.height);
  if (isDragging) {
    swEl.scrollLeft = scrollStartL - (e.clientX - dragStartX);
    swEl.scrollTop = scrollStartT - (e.clientY - dragStartY);
  }
});
window.addEventListener('mouseup', () => { isDragging = false; });
sheetEl.addEventListener('mouseleave', () => { mouseInside = false; });

swEl.addEventListener('wheel', e => {
  if (e.ctrlKey) {
    e.preventDefault();
    if (VIEW !== 'full') setView('full');
    if (e.deltaY < 0) zoomScale = Math.min(3.2, zoomScale * 1.15);
    else zoomScale = Math.max(0.35, zoomScale / 1.15);
  }
}, { passive: false });

function setN(v){
  v=Math.max(NMIN,Math.min(NMAX,Math.round(+v||P.N)));
  if(v===P.N)return;
  P.N=v;
  if(P.nAct>P.N)P.nAct=P.N;
  initAll();recalc();updateToolbarStats();
  PEND={bot:1};if(VIEW==='full'&&v<=6)PEND={top:1};
}

function selectSys(k,flush){
  SEL=k;
  if(flush){TL.run=true;setPlayLabel();pickActive()}
  recalc();
  // Notify parent Flutter app if embedded
  if(window.parent && window.parent !== window){
    window.parent.postMessage({action:'onSysSelect',sys:k},'*');
  }
}

sheetEl.onclick=e=>{
  if (isDragging) return;
  const r=sheetEl.getBoundingClientRect(),x=(e.clientX-r.left+VP.sx)/VP.s;
  selectSys(x<160?1:x<332?2:3,true);
};

/* =================== physics =================== */
function getTable12Cap(dia, tee) {
  let sw = 5.2, sq = 4.0;
  if (dia >= 200) { sw = 21.0; sq = 16.0; }
  else if (dia >= 160 || dia >= 150) { sw = 12.4; sq = 10.0; }
  else if (dia >= 125) { sw = 7.6; sq = 5.8; }
  else if (dia >= 100) { sw = 5.2; sq = 4.0; }
  else if (dia >= 90) { sw = 3.5; sq = 2.7; }
  else if (dia >= 75) { sw = 2.0; sq = 1.5; }
  return tee === 'swept' ? sw : sq;
}

function sim(p){
 const g=9.81,rho=1.2,nu=1e-6,L=p.N*p.H;
 const D=(p.D-6)/1000,Q=Math.min(p.nAct,p.N)*p.qf/1000;
 const t=Math.cbrt(3*nu*Q/(Math.PI*D*9.81));

function drawLoupe(c) {
  const cv = $('sheet');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const R = Math.round(115 * dpr);
  const mx = mouseX * dpr;
  const my = mouseY * dpr;
  const s = VP.s, sx = VP.sx, sy = VP.sy;
  const worldX = (mouseX + sx) / s;
  const worldY = (mouseY + sy) / s;
  const mag = 2.4;
  const sMag = s * mag;

  c.save();
  // Clip circular lens
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.beginPath();
  c.arc(mx, my, R, 0, Math.PI * 2);
  c.clip();

  // Background fill inside loupe
  c.fillStyle = '#02050a';
  c.fillRect(mx - R, my - R, R * 2, R * 2);

  // Render magnified scene
  c.setTransform(dpr * sMag, 0, 0, dpr * sMag, mx - worldX * sMag * dpr, my - worldY * sMag * dpr);
  drawSheet(c);
  OPTS.forEach(k => overlay(c, k));

  c.restore();

  // Draw HUD rim and crosshairs
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);

  // Glowing Outer Bezel
  c.shadowColor = '#00e5ff';
  c.shadowBlur = 16;
  c.strokeStyle = '#00e5ff';
  c.lineWidth = 3.2 * dpr;
  c.beginPath();
  c.arc(mx, my, R, 0, Math.PI * 2);
  c.stroke();
  c.shadowBlur = 0;

  // Inner ring
  c.strokeStyle = 'rgba(255,255,255,0.45)';
  c.lineWidth = 1 * dpr;
  c.beginPath();
  c.arc(mx, my, R - 4 * dpr, 0, Math.PI * 2);
  c.stroke();

  // Reticle crosshair
  c.strokeStyle = 'rgba(0, 229, 255, 0.45)';
  c.lineWidth = 1 * dpr;
  c.beginPath();
  c.moveTo(mx - 16 * dpr, my); c.lineTo(mx + 16 * dpr, my);
  c.moveTo(mx, my - 16 * dpr); c.lineTo(mx, my + 16 * dpr);
  c.stroke();

  // Title Badge
  const bW = 150 * dpr, bH = 20 * dpr;
  c.fillStyle = 'rgba(11, 15, 23, 0.92)';
  c.strokeStyle = '#00e5ff';
  c.lineWidth = 1 * dpr;
  c.fillRect(mx - bW / 2, my + R - 12 * dpr, bW, bH);
  c.strokeRect(mx - bW / 2, my + R - 12 * dpr, bW, bH);
  c.fillStyle = '#00e5ff';
  c.font = `bold ${10 * dpr}px system-ui, sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText('🔭 2.4x दूरबीन (LOUPE)', mx, my + R - 2 * dpr);

  c.restore();
}

let hudMinimized = false;
let hudVisible = true;

$('btnToggleHud').onclick = () => {
  hudMinimized = !hudMinimized;
  $('hud_body').style.display = hudMinimized ? 'none' : 'flex';
  $('btnToggleHud').textContent = hudMinimized ? '+' : '—';
};

$('bCutSection').onclick = () => {

  $('annularHud').style.display = hudVisible ? 'block' : 'none';
  $('bCutSection').classList.toggle('on', hudVisible);
};

function drawAnnularCutSection() {
  if (!hudVisible || hudMinimized) return;
  const cv = $('annularCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const maxR = 46; // Outer pipe shell radius

  // Active flow in LPS
  const activeCount = TL.act ? TL.act.length : Math.min(P.nAct, P.N);
  const activeFlow = activeCount * P.qf;
  const D = P.D; // mm
  const vt = activeFlow > 0 ? (10.1 * Math.pow(activeFlow / D, 0.4)) : 0;
  const lt = 0.17 * vt * vt;
  const D_m = (D - 6) / 1000;
  const Apipe = Math.PI * D_m * D_m / 4;
  const Qw_m3s = activeFlow / 1000;
  const Aw = vt > 0 ? (Qw_m3s / vt) : 0;
  const rw = Math.min(1.0, Math.max(0.0, Aw / Apipe));
  const airFrac = 1.0 - rw;
  const Dair_m = D_m * Math.sqrt(airFrac);
  const tw_m = (D_m - Dair_m) / 2;
  const tw_mm = tw_m * 1000;
  const Dair_mm = Dair_m * 1000;

  // Scale air core radius
  const rAir = Math.max(8, maxR * Math.sqrt(airFrac));

  // 1. Pipe Outer Wall (Graphite Shell)
  ctx.beginPath();
  ctx.arc(cx, cy, maxR + 3, 0, Math.PI * 2);
  ctx.fillStyle = '#1e293b';
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#475569';
  ctx.stroke();

  // 2. Annular Water Film (Blue Fluid Sleeve)
  if (rw > 0.002) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cx, cy, rAir, cx, cy, maxR);
    grad.addColorStop(0, '#38bdf8');
    grad.addColorStop(0.5, '#0284c7');
    grad.addColorStop(1, '#0369a1');
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // 3. Central Air Core
  ctx.beginPath();
  ctx.arc(cx, cy, rAir, 0, Math.PI * 2);
  const airGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, rAir);
  airGrad.addColorStop(0, '#0c4a6e');
  airGrad.addColorStop(1, '#020617');
  ctx.fillStyle = airGrad;
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 3]);
  ctx.strokeStyle = '#38bdf8';
  ctx.stroke();
  ctx.setLineDash([]);

  // 4. Center label
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 8.5px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (rAir > 15) {
    ctx.fillText('AIR CORE', cx, cy - 3);
    ctx.font = '7.5px sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText((airFrac * 100).toFixed(0) + '% Open', cx, cy + 7);
  }

  // Update HUD text metrics
  $('hud_d').textContent = D;
  $('hud_tw').textContent = tw_mm.toFixed(1) + ' mm';
  $('hud_dair').textContent = Dair_mm.toFixed(0) + ' mm';
  $('hud_airpct').textContent = (airFrac * 100).toFixed(0) + '%';
  $('hud_vt').textContent = vt.toFixed(1) + ' m/s';
  $('hud_lt').textContent = lt.toFixed(1) + ' m';

  const st = $('hud_status');
  const qCap = getTable12Cap(P.D, P.tee);
  if (activeFlow > qCap || rw > 0.33) {
    st.textContent = `⚠️ CHOKE FAIL (${activeFlow.toFixed(1)} > ${qCap} L/s)`;
    st.style.background = 'rgba(239,68,68,0.25)';
    st.style.color = '#ef4444';
    st.style.borderColor = 'rgba(239,68,68,0.6)';
  } else if (rw > 0.25 || activeFlow > 0.85 * qCap) {
    st.textContent = `⚡ NEAR LIMIT (${activeFlow.toFixed(1)}/${qCap} L/s)`;
    st.style.background = 'rgba(245,158,11,0.2)';
    st.style.color = '#f59e0b';
    st.style.borderColor = 'rgba(245,158,11,0.5)';
  } else {
    st.textContent = '✓ STABLE ANNULAR';
    st.style.background = 'rgba(16,185,129,0.15)';
    st.style.color = '#10b981';
    st.style.borderColor = 'rgba(16,185,129,0.4)';
  }
}

/* =================== main loop =================== */
function frame(ts){
 const now=ts/1000,dt=Math.min(0.05,now-last||0.016);last=now;
 if(TL.run)step(dt*TL.speed);
 ensureCfg();
 const c=setupSheet();drawSheet(c);OPTS.forEach(k=>overlay(c,k));
 if(LOUPE && mouseInside && mouseX >= 0 && mouseY >= 0) {
   drawLoupe(c);
 }
 if(fcount++%30===0)updateToolbarStats();
 if(fcount%4===0)drawAnnularCutSection();
 requestAnimationFrame(frame);
}

function applySyncedParams(d) {
  if (!d || typeof d !== 'object') return;
  let needsCfg = false;
  let needsAll = false;

  if (d.floors && d.floors !== P.N) {
    P.N = Math.max(NMIN, Math.min(NMAX, Math.round(d.floors)));
    needsCfg = true;
    needsAll = true;
  }
  if (d.nAct !== undefined && d.nAct !== P.nAct) {
    P.nAct = Math.max(1, Math.min(P.N, Math.round(d.nAct)));
    needsAll = true;
  }
  if (d.allFloors) {
    P.nAct = P.N;
    P.pattern = 'all';
    needsAll = true;
  }
  if (d.H !== undefined && d.H !== P.H) { P.H = +d.H; needsAll = true; }
  if (d.seal !== undefined && d.seal !== P.seal) {
    P.seal = +d.seal;
    needsAll = true;
  }
  if (d.qf !== undefined && d.qf !== P.qf) { P.qf = +d.qf; }
  if (d.D !== undefined && d.D !== P.D) { P.D = +d.D; needsCfg = true; }
  if (d.prl !== undefined) {
    const prlVal = d.prl ? 1 : 0;
    if (prlVal !== P.prl) { P.prl = prlVal; needsCfg = true; }
  }
  if (d.prlD !== undefined && d.prlD !== P.prlD) { P.prlD = +d.prlD; needsCfg = true; }
  if (d.tee !== undefined && d.tee !== P.tee) { P.tee = d.tee; }
  if (d.vent !== undefined && d.vent !== P.vent) { P.vent = d.vent; }
  if (d.surge !== undefined && d.surge !== P.surge) { P.surge = +d.surge; }
  if (d.sewer !== undefined && d.sewer !== P.sewer) { P.sewer = +d.sewer; }
  if (d.sys !== undefined && d.sys >= 1 && d.sys <= 3 && d.sys !== SEL) { SEL = d.sys; }
  if (needsCfg) ensureCfg();
  if (needsAll) {
    initAll();
    PEND = { top: 1 };
  }
  if (d.actFloors && Array.isArray(d.actFloors) && d.actFloors.length > 0) {
    TL.act = d.actFloors.slice();
    TL.fa = Math.max(...TL.act);
  }
  if (d.fixtures) { TL.fixtures = d.fixtures; }
  recalc();
  updateToolbarStats();
}

// Full Bi-Directional Message Listener from parent Flutter Web App
window.addEventListener('message', e => {
  let d = e.data;
  if (typeof d === 'string') {
    try { d = JSON.parse(d); } catch (_) {}
  }
  if (!d || typeof d !== 'object') return;

  if (d.action === 'flush') {
    TL.run = true;
    setPlayLabel();
    if (d.singleFloor) {
      TL.act = [d.singleFloor];
      TL.fa = d.singleFloor;
      TL.t0 = TL.t;
      TL.flushes++;
    } else if (d.actFloors && Array.isArray(d.actFloors) && d.actFloors.length > 0) {
      TL.act = d.actFloors.slice();
      TL.fa = Math.max(...TL.act);
      TL.t0 = TL.t;
      TL.flushes++;
    } else {
      pickActive();
    }
    P.nAct = TL.act.length;
    updateToolbarStats();
    setFlushNowActiveState(TL.act);
  }
  if (d.action === 'flushAll') {
    TL.run = true;
    TL.mode = 'hold';
    setPlayLabel();
    P.nAct = P.N;
    P.pattern = 'all';
    TL.act = Array.from({length: P.N}, (_, i) => i + 1);
    TL.fa = P.N;
    TL.t0 = TL.t;
    TL.flushes++;
    updateToolbarStats();
    setFlushAllActiveState();
  }
  if (d.action === 'refill') {
    OPTS.forEach(k => { OS[k].seal.fill(P.seal); OS[k].y.fill(0); OS[k].v.fill(0); });
    resetFlushButtons();
    showToast('↺', 'Traps Refilled to Full Depth (50 mm)', 2200);
  }
  if (d.action === 'clearPeaks') {
    OPTS.forEach(k => {
      OS[k].pmx.fill(0);
      OS[k].pmn.fill(0);
      OS[k].pk = 0;
      OS[k].pn = 0;
    });
  }
  if (d.action === 'pause') {
    TL.run = false;
    setPlayLabel();
  }
  if (d.action === 'play') {
    TL.run = true;
    setPlayLabel();
  }
  if (d.action === 'syncParams') {
    applySyncedParams(d);
  }
});

function checkParentSync() {
  try {
    if (window.parent && window.parent !== window && window.parent.__HULIOT_PARAMS__) {
      const p = window.parent.__HULIOT_PARAMS__;
      const d = typeof p === 'string' ? JSON.parse(p) : p;
      if (d && d.action === 'syncParams' && d.floors && (d.floors !== P.N || d.nAct !== P.nAct || d.sys !== SEL || d.D !== P.D || d.prlD !== P.prlD || (d.allFloors && P.nAct < P.N))) {
        applySyncedParams(d);
      }
    }
  } catch (e) {}
}

// Periodic parent sync fallback (guarantees zero desync even if postMessage had timing issues)
setInterval(checkParentSync, 150);
window.addEventListener('focus', checkParentSync);
window.addEventListener('visibilitychange', checkParentSync);

// Check parent params on startup
checkParentSync();

ensureCfg();recalc();initAll();updateToolbarStats();
checkParentSync();
requestAnimationFrame(frame);
</script>
</body>
