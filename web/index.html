<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Huliot FlowLab: Real-time interactive engineering simulation portal for building drainage stacks, water supply, acoustic attenuation, and siphonic systems.">
  <meta name="theme-color" content="#0B0F17">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Huliot FlowLab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Huliot FlowLab — Engineering Simulation Platform</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #0B0F17;
      color: #E6EDF5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0F17;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(0, 102, 255, 0.2);
      border-top-color: #00D2FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #E6EDF5;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 12px;
      color: #8B9CB3;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">HULIOT FLOWLAB</div>
    <div class="loading-sub">Loading Engineering Simulators...</div>
  </div>

  <script>
    // Always clear old service workers & ensure latest build loads immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) caches.delete(name);
        });
      }
    }
    // Real-Time Web Audio Acoustic Decibel Meter & Microphone Sensor
    window.__huliotAcousticMic = {
      audioCtx: null,
      analyser: null,
      stream: null,
      dataArray: null,
      isActive: false,
      permissionState: "prompt",
      errorMsg: "",
      currentDb: 0.0,
      minDb: 999.0,
      maxDb: 0.0,
      sumDb: 0.0,
      sampleCount: 0,
      avgDb: 0.0,
      startTime: 0,
      samples: [],
      start: function() {
        var self = this;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          self.errorMsg = "Browser does not support microphone audio capture.";
          self.permissionState = "denied";
          return Promise.resolve(false);
        }
        return navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        }).then(function(stream) {
          self.stream = stream;
          self.permissionState = "granted";
          self.errorMsg = "";
          self.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          var source = self.audioCtx.createMediaStreamSource(stream);
          self.analyser = self.audioCtx.createAnalyser();
          self.analyser.fftSize = 1024;
          self.analyser.smoothingTimeConstant = 0.25;
          source.connect(self.analyser);
          self.dataArray = new Uint8Array(self.analyser.fftSize);
          self.isActive = true;
          self.minDb = 999.0;
          self.maxDb = 0.0;
          self.sumDb = 0.0;
          self.sampleCount = 0;
          self.startTime = Date.now();
          self.samples = [];
          self._loop();
          return true;
        }).catch(function(err) {
          console.warn("Microphone access error:", err);
          self.permissionState = "denied";
          self.errorMsg = err.name === "NotAllowedError" || err.name === "PermissionDeniedError"
            ? "Microphone access was denied. Please allow microphone permission in browser settings."
            : err.message;
          self.isActive = false;
          return false;
        });
      },
      stop: function() {
        this.isActive = false;
        if (this.stream) {
          this.stream.getTracks().forEach(function(t) { t.stop(); });
          this.stream = null;
        }
        if (this.audioCtx) {
          this.audioCtx.close();
          this.audioCtx = null;
        }
      },
      _loop: function() {
        if (!this.isActive || !this.analyser) return;
        this.analyser.getByteTimeDomainData(this.dataArray);
        var sumSq = 0;
        for (var i = 0; i < this.dataArray.length; i++) {
          var norm = (this.dataArray[i] - 128) / 128.0;
          sumSq += norm * norm;
        }
        var rms = Math.sqrt(sumSq / this.dataArray.length);
        var db = 0;
        if (rms > 0.00005) {
          var dbFs = 20 * Math.log10(rms);
          db = Math.max(8.0, Math.min(95.0, dbFs + 92.0));
        } else {
          db = 10.0;
        }
        this.currentDb = Number(db.toFixed(1));
        if (this.currentDb < this.minDb) this.minDb = this.currentDb;
        if (this.currentDb > this.maxDb) this.maxDb = this.currentDb;
        this.sumDb += this.currentDb;
        this.sampleCount++;
        this.avgDb = Number((this.sumDb / this.sampleCount).toFixed(1));
        if (this.samples.length > 500) this.samples.shift();
        this.samples.push(this.currentDb);
        var self = this;
        requestAnimationFrame(function() { self._loop(); });
      },
      getReading: function() {
        var durationSec = this.startTime > 0 ? Math.floor((Date.now() - this.startTime) / 1000) : 0;
        return JSON.stringify({
          isActive: this.isActive,
          permissionState: this.permissionState,
          errorMsg: this.errorMsg,
          currentDb: this.currentDb,
          minDb: this.minDb === 999.0 ? 0.0 : this.minDb,
          maxDb: this.maxDb,
          avgDb: this.avgDb,
          durationSec: durationSec,
          sampleCount: this.sampleCount
        });
      }
    };

    window.__HULIOT_PARAMS__ = null;
    window.__huliotDispatchParams = function(data) {
      window.__HULIOT_PARAMS__ = data;
      var str = typeof data === 'string' ? data : JSON.stringify(data);
      var iframes = document.querySelectorAll('iframe');
      for (var i = 0; i < iframes.length; i++) {
        try {
          if (iframes[i].contentWindow) {
            iframes[i].contentWindow.postMessage(str, '*');
          }
        } catch(e) {}
      }
    };
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
